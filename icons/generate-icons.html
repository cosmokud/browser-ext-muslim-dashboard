<!DOCTYPE html>
<html>
<head>
  <title>Icon Generator</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #f5f5f5; }
    .icon-container { display: flex; gap: 20px; flex-wrap: wrap; }
    .icon-box { text-align: center; }
    canvas { border: 1px solid #ccc; background: #fff; }
  </style>
</head>
<body>
  <h1>Muslim Dashboard Icon Generator</h1>
  <p>Right-click on each canvas and "Save image as..." to save the icons.</p>
  <div class="icon-container">
    <div class="icon-box">
      <canvas id="icon16" width="16" height="16"></canvas>
      <p>icon16.png</p>
    </div>
    <div class="icon-box">
      <canvas id="icon32" width="32" height="32"></canvas>
      <p>icon32.png</p>
    </div>
    <div class="icon-box">
      <canvas id="icon48" width="48" height="48"></canvas>
      <p>icon48.png</p>
    </div>
    <div class="icon-box">
      <canvas id="icon128" width="128" height="128"></canvas>
      <p>icon128.png</p>
    </div>
  </div>
  
  <script>
    const sizes = [16, 32, 48, 128];
    
    function drawIcon(ctx, size) {
      const scale = size / 128;
      
      // Background gradient
      const bgGrad = ctx.createLinearGradient(0, 0, size, size);
      bgGrad.addColorStop(0, '#1a5f4a');
      bgGrad.addColorStop(1, '#0d3d2e');
      
      // Gold gradient
      const goldGrad = ctx.createLinearGradient(0, 0, size, size);
      goldGrad.addColorStop(0, '#d4af37');
      goldGrad.addColorStop(1, '#f4d03f');
      
      // Background circle
      ctx.beginPath();
      ctx.arc(64 * scale, 64 * scale, 60 * scale, 0, Math.PI * 2);
      ctx.fillStyle = bgGrad;
      ctx.fill();
      
      // Border
      ctx.beginPath();
      ctx.arc(64 * scale, 64 * scale, 56 * scale, 0, Math.PI * 2);
      ctx.strokeStyle = goldGrad;
      ctx.lineWidth = 2 * scale;
      ctx.stroke();
      
      // Mosque body
      ctx.beginPath();
      ctx.moveTo(64 * scale, 25 * scale);
      ctx.bezierCurveTo(40 * scale, 25 * scale, 30 * scale, 50 * scale, 30 * scale, 60 * scale);
      ctx.lineTo(30 * scale, 90 * scale);
      ctx.lineTo(98 * scale, 90 * scale);
      ctx.lineTo(98 * scale, 60 * scale);
      ctx.bezierCurveTo(98 * scale, 50 * scale, 88 * scale, 25 * scale, 64 * scale, 25 * scale);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
      ctx.fill();
      
      // Dome
      ctx.beginPath();
      ctx.ellipse(64 * scale, 50 * scale, 20 * scale, 16 * scale, 0, 0, Math.PI * 2);
      ctx.fillStyle = goldGrad;
      ctx.fill();
      
      // Crescent
      ctx.beginPath();
      ctx.arc(64 * scale, 30 * scale, 5 * scale, 0, Math.PI * 2);
      ctx.fillStyle = goldGrad;
      ctx.fill();
      
      ctx.beginPath();
      ctx.arc(66 * scale, 29 * scale, 4 * scale, 0, Math.PI * 2);
      ctx.fillStyle = bgGrad;
      ctx.fill();
      
      // Windows
      ctx.beginPath();
      ctx.ellipse(52 * scale, 72 * scale, 5 * scale, 8 * scale, 0, 0, Math.PI * 2);
      ctx.fillStyle = bgGrad;
      ctx.fill();
      
      ctx.beginPath();
      ctx.ellipse(76 * scale, 72 * scale, 5 * scale, 8 * scale, 0, 0, Math.PI * 2);
      ctx.fillStyle = bgGrad;
      ctx.fill();
      
      // Door
      ctx.beginPath();
      ctx.moveTo(58 * scale, 90 * scale);
      ctx.lineTo(58 * scale, 78 * scale);
      ctx.quadraticCurveTo(64 * scale, 72 * scale, 70 * scale, 78 * scale);
      ctx.lineTo(70 * scale, 90 * scale);
      ctx.fillStyle = bgGrad;
      ctx.fill();
    }
    
    sizes.forEach(size => {
      const canvas = document.getElementById('icon' + size);
      const ctx = canvas.getContext('2d');
      drawIcon(ctx, size);
    });
  </script>
</body>
</html>
