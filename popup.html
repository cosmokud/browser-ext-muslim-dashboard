<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muslim Dashboard • Prayer Times</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/popup.css" />
  </head>
  <body class="popup-prayer-times">
    <main class="popup-shell" aria-live="polite">
      <section
        class="card prayer-times-card popup-prayer-card"
        id="prayerTimesCard"
      >
        <div class="card-header">
          <h1 class="card-title">
            <span class="card-icon">🕌</span>
            Prayer Times
          </h1>
          <div class="popup-card-header-controls">
            <div class="location-display" id="locationDisplay">
              <span
                class="location-icon"
                id="popupOpenLocationSettingsIcon"
                role="button"
                tabindex="0"
                title="Open Location settings"
                aria-label="Open Location settings"
                >📍</span
              >
              <span class="location-text" id="locationText">Detecting...</span>
            </div>

            <div class="card-header-actions popup-card-header-actions">
              <div
                class="card-blur-menu popup-card-blur-menu"
                id="popupBlurMenu"
                data-card-id="popupPrayerCard"
              >
                <button
                  class="card-blur-btn popup-icon-btn"
                  id="popupBlurMenuBtn"
                  type="button"
                  title="Blur & Glass Settings"
                  aria-label="Open blur settings"
                >
                  ✨
                </button>

                <div
                  class="blur-settings-popup popup-blur-popup"
                  id="popupBlurModal"
                  role="dialog"
                  aria-label="Popup blur settings"
                >
                  <div class="blur-popup-header">
                    <span class="blur-popup-title">
                      <span class="blur-popup-title-icon">✨</span>
                      Glass Settings
                    </span>
                    <button
                      class="blur-popup-close"
                      id="popupBlurClose"
                      type="button"
                      aria-label="Close"
                    >
                      ×
                    </button>
                  </div>

                  <div class="blur-setting-section">
                    <span class="blur-setting-label">Glass Effect</span>
                    <div
                      class="blur-glass-toggle"
                      role="tablist"
                      aria-label="Popup glass effect"
                    >
                      <button
                        class="blur-glass-option"
                        type="button"
                        data-popup-glass-state="off"
                      >
                        <span class="blur-glass-option-icon">⬜</span>
                        <span class="blur-glass-option-label">Off</span>
                      </button>
                      <button
                        class="blur-glass-option active"
                        type="button"
                        data-popup-glass-state="dashboard"
                      >
                        <span class="blur-glass-option-icon">🔗</span>
                        <span class="blur-glass-option-label">Dash</span>
                      </button>
                      <button
                        class="blur-glass-option"
                        type="button"
                        data-popup-glass-state="on"
                      >
                        <span class="blur-glass-option-icon">✨</span>
                        <span class="blur-glass-option-label">On</span>
                      </button>
                    </div>
                  </div>

                  <div class="blur-setting-section">
                    <div class="blur-power-header">
                      <span class="blur-setting-label">Blur Power</span>
                      <label
                        class="blur-power-toggle"
                        id="popupBlurCustomToggleWrap"
                      >
                        <input
                          type="checkbox"
                          class="blur-power-checkbox"
                          id="popupUseCustomBlurPower"
                        />
                        <span class="blur-power-switch"></span>
                        <span class="blur-power-toggle-label">Custom</span>
                      </label>
                    </div>
                    <div
                      class="blur-power-slider-wrap disabled"
                      id="popupBlurPowerWrap"
                    >
                      <input
                        type="range"
                        class="blur-power-slider"
                        id="popupBlurPowerSlider"
                        min="0"
                        max="200"
                        value="100"
                      />
                      <span class="blur-power-value" id="popupBlurPowerValue"
                        >100%</span
                      >
                    </div>
                  </div>

                  <div class="blur-setting-section popup-color-source-row">
                    <span class="blur-setting-label popup-color-source-label"
                      >Color Source</span
                    >
                    <label class="blur-power-toggle" for="popupUseCustomColors">
                      <input
                        type="checkbox"
                        class="blur-power-checkbox"
                        id="popupUseCustomColors"
                      />
                      <span class="blur-power-switch"></span>
                      <span
                        class="blur-power-toggle-label"
                        id="popupColorSourceText"
                        >Follow Dashboard</span
                      >
                    </label>
                  </div>

                  <div class="theme-palette-fields" id="popupPaletteFields">
                    <div class="theme-palette-field">
                      <label class="setting-label" for="popupBlurPrimaryColor"
                        >Primary</label
                      >
                      <div class="popup-color-field-controls">
                        <input
                          type="color"
                          id="popupBlurPrimaryColor"
                          class="theme-palette-color"
                        />
                        <button
                          class="popup-color-reset-btn"
                          type="button"
                          data-popup-reset-color="primary"
                        >
                          Reset
                        </button>
                      </div>
                    </div>

                    <div class="theme-palette-field">
                      <label class="setting-label" for="popupBlurAccentColor"
                        >Accent</label
                      >
                      <div class="popup-color-field-controls">
                        <input
                          type="color"
                          id="popupBlurAccentColor"
                          class="theme-palette-color"
                        />
                        <button
                          class="popup-color-reset-btn"
                          type="button"
                          data-popup-reset-color="accent"
                        >
                          Reset
                        </button>
                      </div>
                    </div>

                    <div class="theme-palette-field">
                      <label
                        class="setting-label"
                        for="popupBlurBackgroundColor"
                        >Background</label
                      >
                      <div class="popup-color-field-controls">
                        <input
                          type="color"
                          id="popupBlurBackgroundColor"
                          class="theme-palette-color"
                        />
                        <button
                          class="popup-color-reset-btn"
                          type="button"
                          data-popup-reset-color="background"
                        >
                          Reset
                        </button>
                      </div>
                    </div>

                    <div class="theme-palette-field">
                      <label class="setting-label" for="popupBlurTintColor"
                        >Glass Tint</label
                      >
                      <div class="popup-color-field-controls">
                        <input
                          type="color"
                          id="popupBlurTintColor"
                          class="theme-palette-color"
                        />
                        <button
                          class="popup-color-reset-btn"
                          type="button"
                          data-popup-reset-color="glassTint"
                        >
                          Reset
                        </button>
                      </div>
                    </div>
                  </div>

                  <div class="popup-blur-actions">
                    <button
                      class="popup-color-reset-btn"
                      id="popupBlurResetBtn"
                      type="button"
                    >
                      Reset All
                    </button>
                  </div>
                </div>
              </div>

              <button
                class="popup-open-settings-btn popup-icon-btn"
                id="popupOpenPrayerSettingsBtn"
                type="button"
                title="Open Prayer Times settings"
                aria-label="Open Prayer Times settings"
              >
                ⚙️
              </button>
            </div>
          </div>
        </div>

        <div class="next-prayer" id="nextPrayer">
          <div class="popup-next-prayer-main">
            <span class="next-prayer-label">Next Prayer:</span>
            <span class="next-prayer-name" id="nextPrayerName">--</span>
          </div>
          <span class="next-prayer-countdown" id="nextPrayerCountdown"
            >--:--:--</span
          >
        </div>

        <div class="prayer-list" id="prayerList"></div>
      </section>

      <section
        class="card popup-hidden-note"
        id="popupPrayerHiddenState"
        hidden
      >
        <h2 class="popup-hidden-title">Prayer Times is hidden in Dashboard</h2>
        <p class="popup-hidden-text">
          Enable Prayer Times in Dashboard Settings to show the same component
          here.
        </p>
        <button
          class="popup-open-dashboard-btn popup-icon-btn"
          id="popupOpenDashboardBtn"
          type="button"
          title="Open Prayer Times settings"
          aria-label="Open Prayer Times settings"
        >
          ⚙️
        </button>
      </section>
    </main>

    <script src="js/praytimes.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/themes.js"></script>
    <script src="js/iconthemes.js"></script>
    <script src="js/prayertimes.js"></script>
    <script src="js/popup.js"></script>
  </body>
</html>
